name: build-provenance

# G-07/G-26 five-piece set, piece 5: signed build provenance.
# Every sdist/wheel shipped from this repository gets an OIDC-signed
# attestation (SLSA build provenance), so consumers can verify the artifact
# was built by this repository's GitHub Actions, not re-hosted or tampered.
# Pinned actions to commit SHAs (Scorecard Pinned-Dependencies).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade pip && pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate artifact attestation (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "dist/*"

      - name: Upload build artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: dist
          path: dist/
