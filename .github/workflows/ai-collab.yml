name: ai-collab

# Multi-AI collaboration pipeline for uibc-core.
#   divide  ->  review A + review B (parallel)  ->  rebut (mutual adversarial arbitration)
#           ->  fix (proposal only)  ->  test (pytest)  ->  aggregate  ->  human acceptance
#
# SAFETY BY DESIGN
#   * trigger: collab-branch pushes (ai-collab*), self-trigger loop blocked via paths-ignore
#     + [skip ci] on the bot report commit. Never on main. Manual dispatch also allowed.
#   * hard guard: refuses to run on `main`; writes only to the collab branch.
#   * no auto-merge, no release, no publish, no PR to main.
#   * free tier only: GitHub Models via the built-in GITHUB_TOKEN (permissions: models: read).
#     No personal token, no paid API key, no secret stored in the repo.

on:
  push:
    branches:
      - ai-collab
      - "ai-collab-*"
    paths-ignore:
      - ".github/ai-collab/runs/**"
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref to diff against"
        required: false
        default: main
      ref:
        description: "Collab ref to review"
        required: false
        default: ai-collab

permissions:
  contents: write
  models: read
  actions: read

concurrency:
  group: ai-collab-${{ github.ref }}
  cancel-in-progress: false

env:
  COLLAB_BASE: ${{ inputs.base || 'main' }}
  COLLAB_REF: ${{ inputs.ref || github.ref_name }}
  # Optional model seats (openai-compatible). Unset => keyless heuristic seats, honestly labelled.
  COLLAB_LLM_BASE_URL: ${{ vars.COLLAB_LLM_BASE_URL }}
  COLLAB_LLM_MODELS: ${{ vars.COLLAB_LLM_MODELS }}
  COLLAB_LLM_KEY: ${{ secrets.COLLAB_LLM_KEY }}

jobs:
  guard:
    name: "0. guard (never run on main)"
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to operate on main
        run: |
          echo "ref_name=${{ github.ref_name }}  ref=${{ github.ref }}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "::error::ai-collab must never run on main (branch-isolated pipeline)"
            exit 1
          fi
          echo "guard OK: running on ${{ github.ref_name }}"

  divide:
    name: "1. auto task division"
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.run.outputs.files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/ai-collab/collab.py divide --base "$COLLAB_BASE" --ref "$COLLAB_REF" --out out/tasks.json
          echo "files=$(python -c "import json;print(json.load(open('out/tasks.json'))['file_count'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s1-tasks
          path: out

  review:
    name: "2. parallel review (${{ matrix.seat }})"
    needs: divide
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seat: [a, b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: s1-tasks
          path: out
      - name: Run seat ${{ matrix.seat }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/ai-collab/collab.py review --seat "${{ matrix.seat }}" --tasks out/tasks.json --out "out/review-${{ matrix.seat }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s2-review-${{ matrix.seat }}
          path: out

  ollama-review:
    name: "2b. real-model seats (self-hosted runner + local Ollama)"
    needs: divide
    runs-on: [self-hosted, ollama]
    # skipped entirely unless the repo variable is set -- keeps the free/zero-key default
    if: ${{ vars.COLLAB_LLM_BASE_URL != '' }}
    timeout-minutes: 60
    steps:
      - name: "Checkout via SSH (pre-staged key material in the runner tree -- the job context cannot read the user profile .ssh directory)"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sshDir = 'C:/Users/Administrator/actions-runner/_ssh'
          $key = "$sshDir/id_ed25519"
          $khFwd = "$sshDir/known_hosts"
          $env:GIT_SSH_COMMAND = "ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$khFwd"
          $url = 'ssh://git@ssh.github.com:443/zhaoxinghua09-cell/uibc-core.git'
          $ref = "$env:GITHUB_REF_NAME"
          Write-Host "checkout ref: $ref"
          if (Test-Path .git) {
            git remote set-url origin $url
            git fetch -q --depth 1 origin $ref
            if ($LASTEXITCODE -ne 0) { throw "checkout via ssh failed at fetch" }
            git checkout -q -f FETCH_HEAD
            git clean -qfdx
          } else {
            git clone -q --depth 1 --branch $ref $url .
            if ($LASTEXITCODE -ne 0) { throw "checkout via ssh failed at clone" }
          }
          git log --oneline -1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: s1-tasks
          path: out
      - name: Run heterogeneous local Ollama seats (A + B, two different models)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLAB_LLM_NUM_GPU: '0'
          COLLAB_HTTP_TIMEOUT: '600'
        run: |
          python .github/ai-collab/collab.py review --seat a --tasks out/tasks.json --out out/review-ollama-a.json
          python .github/ai-collab/collab.py review --seat b --tasks out/tasks.json --out out/review-ollama-b.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s2b-review-ollama
          path: out

  rebut:
    name: "3. mutual rebuttal + arbitration"
    needs: review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: s2-review-*
          merge-multiple: true
          path: out
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/ai-collab/collab.py rebut --review-a out/review-a.json --review-b out/review-b.json --out out/rebuttal.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s3-rebuttal
          path: out

  fix:
    name: "4. fix proposal (never applied)"
    needs: rebut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: s3-rebuttal
          path: out
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/ai-collab/collab.py fix --rebuttal out/rebuttal.json --out out/proposed-fix.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s4-fix
          path: out

  test:
    name: "5. test collection (pytest)"
    needs: rebut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          [ -f requirements.txt ] && pip install -q -r requirements.txt || true
          pip install -q pytest || true
      - name: Run pytest (never blocks on failure -- result is collected as evidence)
        id: pytest
        run: |
          set +e
          mkdir -p out
          python -m pytest tests -q > out/pytest.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -30 out/pytest.log || true
          exit 0
      - name: Collect test evidence
        run: |
          python .github/ai-collab/collab.py collect-tests --log out/pytest.log --out out/tests.json --exit-code "${{ steps.pytest.outputs.exit }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s5-tests
          path: out

  aggregate:
    name: "6. aggregate + publish report to collab branch only"
    needs: [fix, test, ollama-review]
    if: ${{ !cancelled() && needs.fix.result == 'success' && needs.test.result == 'success' && (needs['ollama-review'].result == 'success' || needs['ollama-review'].result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: s*
          merge-multiple: true
          path: out
      - name: Build report (fails loudly if any stage produced nothing)
        run: |
          python .github/ai-collab/collab.py aggregate --dir out --out out/COLLAB-REPORT.md
      - name: Commit report to the collab branch ONLY (main is impossible here)
        run: |
          set -e
          git config user.name "ai-collab-bot"
          git config user.email "ai-collab-bot@users.noreply.github.com"
          mkdir -p .github/ai-collab/runs
          cp out/COLLAB-REPORT.md ".github/ai-collab/runs/COLLAB-REPORT-${{ github.run_id }}.md"
          git add ".github/ai-collab/runs/COLLAB-REPORT-${{ github.run_id }}.md"
          git diff --cached --quiet && echo "no report change" && exit 0
          git commit -m "chore(ai-collab): collaboration report for run ${{ github.run_id }} [skip ci]"
          git push origin "HEAD:$COLLAB_REF"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s6-collab-report
          path: out
      - name: Job summary
        run: cat out/COLLAB-REPORT.md >> "$GITHUB_STEP_SUMMARY"
